[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "massive-access"
version = "0.1.0"
description = "Authenticated data access module for the Massive.com (ex-Polygon.io) REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
massive-access = "massive_access.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/massive_access"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
